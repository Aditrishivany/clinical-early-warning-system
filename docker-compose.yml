services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-backend
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=sqlite:////app/data/clinical.db
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - db_data:/app/data
      - ./logs:/app/logs
    networks:
      - clinical-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      start_period: 45s
      retries:  3

  frontend:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000/api/v1}
    container_name: clinical-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clinical-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  clinical-network:
    driver: bridge
