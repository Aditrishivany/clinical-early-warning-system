services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./clinical_prod.db
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - clinical-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      retries:  3

  frontend:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile.frontend
    container_name: clinical-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clinical-network
    restart: unless-stopped

networks:
  clinical-network:
    driver: bridge